[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not integration and not ui_integration"
markers =
    integration: headless batch-insert E2E (BatchInsertE2E + Word COM)
    ui_integration: full WinForms UI E2E (FlaUI + registered add-in)
    smoke: tier-1 quick check; minimal images (see lib/e2e_tiers.py)
    standard: tier-2 parameter matrix without bulk folder cases
    full: tier-3 includes all-folder cases (~29 images each)
