name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    name: WordTools.Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build WordTools Release
        shell: pwsh
        run: msbuild WordTools\WordTools.csproj /p:Configuration=Release /p:Platform=AnyCPU /v:minimal

      - name: dotnet test
        run: dotnet test WordTools.Tests --verbosity normal

  automation-gate:
    name: automation (no integration)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: automation
        run: python -m pip install -r requirements.txt

      - name: pytest
        working-directory: automation
        run: python -m pytest tests -v
