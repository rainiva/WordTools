name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    name: WordTools.Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build WordTools Release
        shell: pwsh
        run: |
          $msbuild = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild not found on runner."
          }
          & $msbuild WordTools\WordTools.csproj /p:Configuration=Release /p:Platform=AnyCPU /v:minimal

      - name: dotnet test
        run: dotnet test WordTools.Tests --verbosity normal

  automation-gate:
    name: automation (no integration)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: automation
        run: python -m pip install -r requirements.txt

      - name: pytest
        working-directory: automation
        run: python -m pytest tests -v
